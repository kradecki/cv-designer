name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build skill zip
        run: cd plugins/cv-designer/skills && zip -r "$GITHUB_WORKSPACE/cv-designer.zip" cv-designer -x '*/__pycache__/*' -x '*/evals/*'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: cv-designer.zip
          generate_release_notes: true
